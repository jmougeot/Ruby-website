<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable — Ruby</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #0f0f0f;
            text-align: center;
            padding: 2rem;
        }
        .error { max-width: 480px; }
        .error__code {
            font-size: clamp(4rem, 10vw, 8rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1;
            color: #e31c3d;
            margin-bottom: 1rem;
        }
        .error__title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .error__message {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .error__link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 2rem;
            background: #e31c3d;
            color: #fff;
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .error__link:hover { background: #c41230; }
    </style>
</head>
<body>
    <div class="error">
        <div class="error__code">404</div>
        <h1 class="error__title">Page introuvable</h1>
        <p class="error__message">La page que vous cherchez n'existe pas ou a été déplacée.</p>
        <a href="/" class="error__link">Retour à l'accueil →</a>
    </div>
</body>
</html>
