<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruby — Become the sales rep you know you can be</title>
    <meta
      name="description"
      content="Ruby analyzes your calls, identifies what's holding you back, and helps you improve one habit at a time."
    />
    <link rel="canonical" href="https://www.rubysignal.com/" />

    <!-- Open Graph / Twitter : aperçus de partage (LinkedIn, Slack, X…). Repris de
         l'ancienne vitrine, adaptés à la nouvelle home anglaise. og:image = visuel de
         la grotte (placeholder ; idéalement une carte 1200×630 dédiée). -->
    <meta property="og:title" content="Ruby — Become the sales rep you know you can be" />
    <meta
      property="og:description"
      content="Ruby analyzes your calls, identifies what's holding you back, and helps you improve one habit at a time."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.rubysignal.com/" />
    <meta property="og:image" content="https://www.rubysignal.com/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ruby — Become the sales rep you know you can be" />
    <meta
      name="twitter:description"
      content="Ruby analyzes your calls, identifies what's holding you back, and helps you improve one habit at a time."
    />
    <meta name="twitter:image" content="https://www.rubysignal.com/og-card.jpg" />

    <!-- POSTER du hero (1re frame du voyage 3D) : affiché instantanément à la place
         de l'ancien écran de chargement → à précharger en priorité (c'est le LCP). -->
    <link rel="preload" href="/hero-first-frame.webp" as="image" fetchpriority="high" />

    <!-- POLICES AUTO-HÉBERGÉES (déclarées dans src/index.css) : l'ancienne chaîne
         googleapis (CSS) → gstatic (woff2) coûtait ~1,4 s sur le chemin critique.
         Fichiers VARIABLES : un seul woff2 par famille couvre tous les poids. -->
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- TEXTURES DE ROCHE pré-cuites : la 1re frame 3D les ATTEND (loading manager),
         mais sans preload elles ne partaient qu'après le téléchargement + parse du
         chunk CaveScene → les précharger fait « prendre vie » la grotte plus tôt.
         crossorigin OBLIGATOIRE : TextureLoader de three charge en anonymous par
         défaut ; sans lui, le mode de credentials diffère → preload ignoré et
         fichier téléchargé DEUX fois.
         fetchpriority=low : elles ne servent qu'à la 1re frame 3D (plusieurs secondes
         après le LCP) → elles ne doivent pas voler la bande passante du JS critique
         ni des polices sur connexion lente. -->
    <link rel="preload" href="/rock-normal.webp" as="image" crossorigin="anonymous" fetchpriority="low" />
    <link rel="preload" href="/rock-rough.webp" as="image" crossorigin="anonymous" fetchpriority="low" />

    <!-- Données structurées (schema.org) : aide Google à comprendre la marque,
         le site et le produit → éligibilité aux résultats enrichis. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.rubysignal.com/#organization",
            "name": "Ruby",
            "url": "https://www.rubysignal.com/",
            "logo": "https://www.rubysignal.com/assets/images/logo.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://www.rubysignal.com/#website",
            "url": "https://www.rubysignal.com/",
            "name": "Ruby",
            "publisher": { "@id": "https://www.rubysignal.com/#organization" },
            "inLanguage": "en"
          },
          {
            "@type": "SoftwareApplication",
            "name": "Ruby",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "https://www.rubysignal.com/",
            "description": "Ruby analyzes your calls, identifies what's holding you back, and helps you improve one habit at a time.",
            "publisher": { "@id": "https://www.rubysignal.com/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
