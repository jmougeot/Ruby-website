name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1) Blog + pages historiques (Eleventy) → _site/  (génère un index.html qui
      #    sera ÉCRASÉ par la landing à l'étape 3 ; /blog/, /privacy.html, CNAME… restent)
      - name: Install Eleventy deps
        run: npm ci
      - name: Build blog (Eleventy)
        run: npm run build

      # 2) Landing page (React/Vite) → landing/dist/
      - name: Install landing deps
        run: npm ci
        working-directory: landing
      - name: Build landing (Vite)
        run: npm run build
        working-directory: landing

      # 3) Fusion : la landing devient la RACINE du site (/), le blog reste en /blog/.
      #    `dist/.` copie le CONTENU (dont index.html) dans _site/ ; cp écrase l'ancien
      #    index.html. Les assets Vite (hashés, dans /assets/) cohabitent avec ceux du
      #    blog (/assets/images, /assets/blog) sans collision.
      - name: Merge landing into site root
        run: cp -R landing/dist/. _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
